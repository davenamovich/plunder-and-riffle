kind = "web"
previewPath = "/"
title = "BTC Experiment"
version = "1.0.0"
id = "artifacts/btc-experiment"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 21250
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/btc-experiment run dev"

[services.env]
PORT = "21250"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/btc-experiment", "run", "build"]
publicDir = "artifacts/btc-experiment/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
